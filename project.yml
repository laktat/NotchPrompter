name: NotchPrompter

options:
  bundleIdPrefix: com.matejlakomy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

targets:
  NotchPrompter:
    type: application
    platform: macOS
    sources:
      - path: NotchPrompter
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: NotchPrompter/Support/Info.plist
      properties:
        CFBundleDisplayName: NotchPrompter
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Local-only teleprompter. No network, no analytics."
        NSMicrophoneUsageDescription: "NotchPrompter listens to your microphone level so the script scrolls only while you are speaking. Audio never leaves your Mac."
        NSSpeechRecognitionUsageDescription: "NotchPrompter recognises your speech on-device to follow along and highlight the word you are reading. Audio never leaves your Mac."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejlakomy.NotchPrompter
        PRODUCT_NAME: NotchPrompter
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
